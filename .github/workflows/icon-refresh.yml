name: Weekly Icon Refresh

on:
  schedule:
    - cron: "0 2 * * 1" # Every Monday at 2 AM UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: icon-refresh
  cancel-in-progress: false

jobs:
  refresh-icons:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch icons and regenerate the registry
        run: bun run fetch:data

      # Opens a PR, or updates the existing one, instead of committing to main.
      - name: Open or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/icon-refresh
          delete-branch: true
          add-paths: |
            assets/custom-icons
            utils/iconRegistry.generated.ts
          commit-message: "chore(icons): refresh icons from 2fa.directory"
          title: "chore(icons): refresh icons from 2fa.directory"
          body: |
            Automated weekly refresh of the bundled service icons from
            [2fa.directory](https://2fa.directory), generated by `bun run fetch:data`.

            - New icons are downloaded and converted to 100x100 AVIF
            - Icons for services no longer listed are removed
            - `utils/iconRegistry.generated.ts` is regenerated
